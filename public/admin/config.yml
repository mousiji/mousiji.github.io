# Decap CMS 后台配置
# 后台地址：/admin/  （本地开发与线上均可用）

# ============================================================
# 线上登录：DecapBridge（托管认证网关）
# 说明：本地访问 localhost 时自动走本地代理（见下方 local_backend），
#       线上访问时用 DecapBridge 账号登录并写回 GitHub 仓库。
# 站点 ID：128bad09-388e-4892-a189-c4d7f0d20e8b（在 decapbridge.com 后台可查）
# ============================================================
backend:
  name: git-gateway
  repo: mousiji/mousiji.github.io
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/128bad09-388e-4892-a189-c4d7f0d20e8b/pkce
  auth_token_endpoint: /sites/128bad09-388e-4892-a189-c4d7f0d20e8b/token
  gateway_url: https://gateway.decapbridge.com

# 提交信息记录操作者，便于追溯谁改了内容（DecapBridge 推荐）
commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# PKCE 用户字段映射（DecapBridge 推荐）
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# 本地开发：配合 decap-server 使用，免登录直接读写本地 Git 仓库
# （仅在浏览器地址为 localhost 时生效，不影响线上登录）
local_backend: true

# 图片上传位置
media_folder: "public/images"
public_folder: "/images"

# 站点信息
site_url: https://mousiji.github.io
display_url: https://mousiji.github.io
logo_url: /images/avatar.png

# 界面语言：简体中文（由 index.html 注册 zh_Hans 语言包）
locale: zh_Hans

collections:
  # ===== 文章 =====
  - name: blog
    label: 📝 文章
    label_singular: 文章
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要（卡片上显示）, name: description, widget: text, required: false }
      - { label: 发布日期, name: pubDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 更新日期（可选）, name: updatedDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: 封面图（可选）, name: heroImage, widget: image, required: false, choose_url: true }
      - label: 标签
        name: tags
        widget: list
        default: []
        field: { label: 标签, name: tag, widget: string }
      - { label: 草稿（开启则不发布到线上）, name: draft, widget: boolean, default: false }
      - { label: 正文（Markdown）, name: body, widget: markdown }

  # ===== 友链 =====
  - name: friends
    label: 🤝 友链
    label_singular: 友链
    folder: src/content/friends
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: 网站名称, name: name, widget: string }
      - { label: 网址, name: url, widget: string }
      - { label: 头像链接（可选）, name: avatar, widget: string, required: false }
      - { label: 一句话描述（可选）, name: description, widget: text, required: false }
