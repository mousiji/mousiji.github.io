# mousiji 博客 —— 纯静态站点 nginx 配置
# 由 deploy/setup.sh 复制到 /etc/nginx/conf.d/mousiji.conf
# 注意：certbot --nginx 上过 HTTPS 后会改写本文件；重跑 setup.sh 会覆盖它，届时重跑 certbot 即可
server {
    listen 80;
    listen [::]:80;
    server_name moskie.vip www.moskie.vip;

    root /var/www/mousiji;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/mousiji.access.log;
    error_log  /var/log/nginx/mousiji.error.log;

    # 文本压缩，省流量提速
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # 构建产物带内容哈希（/_assets/xxx.哈希.css），可永久缓存
    location /_assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 首页不缓存，保证发文章立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态文件主逻辑（/blog/hello-gridea/ → /blog/hello-gridea/index.html）
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
